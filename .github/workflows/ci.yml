name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Apex/LWC formatting check (also catches Apex syntax errors)
        run: npm run format:check
      - name: LWC unit tests
        run: npm run test:unit --if-present

  apex-tests:
    # Runs only when the repo owner has added an SFDX_AUTH_URL secret for a Dev Hub.
    # No credentials are stored in this repository.
    runs-on: ubuntu-latest
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SFDX_AUTH_URL != ''
      - name: Install Salesforce CLI
        if: env.SFDX_AUTH_URL != ''
        run: npm install --global @salesforce/cli
      - name: Authenticate Dev Hub
        if: env.SFDX_AUTH_URL != ''
        run: |
          echo "$SFDX_AUTH_URL" > authurl.txt
          sf org login sfdx-url --sfdx-url-file authurl.txt --set-default-dev-hub --alias devhub
          rm authurl.txt
      - name: Create scratch org, deploy, run Apex tests
        if: env.SFDX_AUTH_URL != ''
        run: |
          sf org create scratch --definition-file config/project-scratch-def.json --alias ci --set-default --duration-days 1 --wait 10
          sf project deploy start --wait 20
          sf apex run test --test-level RunLocalTests --code-coverage --result-format human --wait 20
      - name: Delete scratch org
        if: always() && env.SFDX_AUTH_URL != ''
        run: sf org delete scratch --target-org ci --no-prompt || true
